
spring.application.name=backend

# Google Safe Browsing API Key
google.safebrowsing.api-key=AIzaSyAjDX_EY6oIUz2Ke90ZnE5AaiDwm3AE1qs

# ============================================
# 1. H2 파일 기반 DB 설정 (AUTO_SERVER=TRUE 추가)
# ============================================
spring.datasource.url=jdbc:h2:file:./data/phishing_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 대시보드 활성화 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# 2. JPA 설정 (H2 Dialect 명시적 추가)
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# 3. Redis 고속 캐싱 설정
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis가 안 켜져 있을 때 스프링 기본 ConcurrentMap 캐시 사용
spring.cache.type=simple