# Google Safe Browsing API Key
google.safebrowsing.api-key=

# ============================================
# 1. MySQL 데이터베이스 설정 (기존 H2 대체)
# ============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/qish_detector?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.jackson.time-zone=Asia/Seoul
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.datasource.username=root
spring.datasource.password=1234

# H2 대시보드 비활성화
spring.h2.console.enabled=false

# ============================================
# 2. JPA 설정 (MySQL Dialect 적용)
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# 3. Redis 고속 캐싱 설정
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis가 안 켜져 있을 때 스프링 기본 ConcurrentMap 캐시 사용
spring.cache.type=simple